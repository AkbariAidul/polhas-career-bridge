<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Select Element</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Test Program Studi Select</h1>
        
        <!-- Test 1: Basic HTML Select -->
        <div class="mb-6">
            <h2 class="font-bold mb-2">Test 1: Basic HTML Select</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Program Studi (Basic)</label>
            <select id="test-select-1" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                <option value="">Pilih Program Studi</option>
                <option value="D3 Teknik Informatika">D3 Teknik Informatika</option>
                <option value="D4 Bisnis Digital">D4 Bisnis Digital</option>
            </select>
        </div>
        
        <!-- Test 2: With Tailwind Classes (Same as Modal) -->
        <div class="mb-6">
            <h2 class="font-bold mb-2">Test 2: With Tailwind Classes</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Program Studi (Tailwind)</label>
            <select id="test-select-2" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition cursor-pointer bg-white">
                <option value="">Pilih Program Studi</option>
                <option value="D3 Teknik Informatika">D3 Teknik Informatika</option>
                <option value="D4 Bisnis Digital">D4 Bisnis Digital</option>
            </select>
        </div>
        
        <!-- Test 3: With Inline Styles (Same as Modal) -->
        <div class="mb-6">
            <h2 class="font-bold mb-2">Test 3: With Inline Styles</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Program Studi (Inline)</label>
            <select id="test-select-3" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition cursor-pointer bg-white" style="display: block !important; visibility: visible !important; opacity: 1 !important; height: auto !important; min-height: 42px !important;">
                <option value="">Pilih Program Studi</option>
                <option value="D3 Teknik Informatika">D3 Teknik Informatika</option>
                <option value="D4 Bisnis Digital">D4 Bisnis Digital</option>
            </select>
        </div>
        
        <!-- Test 4: Exact Copy from Modal -->
        <div class="mb-6">
            <h2 class="font-bold mb-2">Test 4: Exact Copy from Modal</h2>
            <label class="block text-sm font-medium text-gray-700 mb-1">Program Studi</label>
            <select id="register-prodi" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition cursor-pointer bg-white" style="display: block !important; visibility: visible !important; opacity: 1 !important; height: auto !important; min-height: 42px !important;">
                <option value="">Pilih Program Studi</option>
                <option value="D3 Teknik Otomotif">D3 Teknik Otomotif</option>
                <option value="D3 Teknik Informatika">D3 Teknik Informatika</option>
                <option value="D3 Budidaya Tanaman Perkebunan">D3 Budidaya Tanaman Perkebunan</option>
                <option value="D4 Teknologi Rekayasa Multimedia">D4 Teknologi Rekayasa Multimedia</option>
                <option value="D4 Akuntansi Bisnis Digital">D4 Akuntansi Bisnis Digital</option>
                <option value="D4 Bisnis Digital">D4 Bisnis Digital</option>
                <option value="D4 Manajemen Pemasaran Internasional">D4 Manajemen Pemasaran Internasional</option>
            </select>
        </div>
        
        <button onclick="checkSelects()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
            Check All Selects in Console
        </button>
    </div>
    
    <script>
        function checkSelects() {
            const selects = document.querySelectorAll('select');
            console.log('=== SELECT ELEMENTS DEBUG ===');
            selects.forEach((select, index) => {
                console.log(`\nSelect ${index + 1} (id: ${select.id}):`);
                console.log('  - Display:', window.getComputedStyle(select).display);
                console.log('  - Visibility:', window.getComputedStyle(select).visibility);
                console.log('  - Opacity:', window.getComputedStyle(select).opacity);
                console.log('  - Height:', window.getComputedStyle(select).height);
                console.log('  - Width:', window.getComputedStyle(select).width);
                console.log('  - Position:', window.getComputedStyle(select).position);
                console.log('  - Z-index:', window.getComputedStyle(select).zIndex);
                console.log('  - Options:', select.options.length);
                console.log('  - Bounding Rect:', select.getBoundingClientRect());
            });
        }
        
        // Auto-check on load
        window.addEventListener('load', () => {
            setTimeout(checkSelects, 500);
        });
    </script>
</body>
</html>
