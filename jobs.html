<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Lowongan Magang - Polhas CareerBridge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-jakarta antialiased">
    
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Hero -->
    <section class="pt-32 pb-12 bg-gradient-to-br from-blue-50 to-white">
        <div class="container mx-auto px-6">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-5xl font-extrabold mb-4">
                    Temukan <span class="text-gradient">Lowongan Impianmu</span>
                </h1>
                <p class="text-xl text-gray-600 mb-8">47 lowongan magang & kerja dari Hasnur Group dan mitra</p>
            </div>
        </div>
    </section>

    <!-- Search Section -->
    <section class="py-12 bg-white">
        <div class="container mx-auto px-6">
            <div class="max-w-5xl mx-auto">
                <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6">
                    <div class="grid md:grid-cols-4 gap-4">
                        <div class="md:col-span-2">
                            <div class="relative">
                                <input type="text" id="search-input" placeholder="Cari posisi atau perusahaan..." 
                                    class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition">
                                <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>
                        <select id="type-filter" class="px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition cursor-pointer">
                            <option value="">Semua Tipe</option>
                            <option value="PKL">PKL/Magang</option>
                            <option value="Kerja">Kerja</option>
                        </select>
                        <select id="prodi-filter" class="px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition cursor-pointer">
                            <option value="">Semua Prodi</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Jobs Grid -->
    <section class="py-12 bg-gray-50">
        <div class="container mx-auto px-6">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h3 class="text-2xl font-bold mb-1">Lowongan Terbaru</h3>
                    <p class="text-gray-600" id="job-count">Menampilkan 0 lowongan</p>
                </div>
            </div>

            <div id="job-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Jobs will be rendered here -->
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div id="job-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-6">
        <!-- Modal content will be rendered by JS -->
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Auth Modal Container -->
    <div id="auth-modal-container"></div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <!-- Load Components First -->
    <script type="module">
        import { loadCommonComponents } from './js/components.js';
        await loadCommonComponents();
    </script>
    
    <!-- Then load main.js -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
