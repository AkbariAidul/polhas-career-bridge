<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowongan Tersimpan - Polhas CareerBridge</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-jakarta antialiased">
    
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="pt-32 pb-20">
        <div class="container mx-auto px-6">
            
            <!-- Header -->
            <div class="text-center mb-12">
                <h1 class="text-4xl font-bold mb-4">💼 Lowongan Tersimpan</h1>
                <p class="text-gray-600 text-lg" id="saved-count">0 lowongan tersimpan</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-20">
                <svg class="w-32 h-32 mx-auto mb-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                </svg>
                <h3 class="text-2xl font-bold text-gray-900 mb-2">Belum Ada Lowongan Tersimpan</h3>
                <p class="text-gray-600 mb-6">Mulai simpan lowongan yang kamu minati untuk akses cepat</p>
                <a href="jobs.html" class="inline-block bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                    Jelajahi Lowongan
                </a>
            </div>

            <!-- Saved Jobs Grid -->
            <div id="saved-jobs-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Will be populated by JS -->
            </div>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Auth Modal Container -->
    <div id="auth-modal-container"></div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <!-- Load Components First -->
    <script type="module">
        import { loadCommonComponents } from './js/components.js';
        await loadCommonComponents();
    </script>
    
    <script type="module">
        import { jobs } from './js/data.js';

        // Get saved jobs from localStorage
        const savedJobs = JSON.parse(localStorage.getItem('savedJobs')) || [];
        const savedJobsData = jobs.filter(job => savedJobs.includes(job.id));

        // Update count
        document.getElementById('saved-count').textContent = `${savedJobsData.length} lowongan tersimpan`;

        // Show empty state or jobs
        if (savedJobsData.length === 0) {
            document.getElementById('empty-state').classList.remove('hidden');
        } else {
            renderSavedJobs(savedJobsData);
        }

        function renderSavedJobs(data) {
            const container = document.getElementById('saved-jobs-container');
            
            container.innerHTML = data.map((job, index) => {
                const prodiText = Array.isArray(job.prodi) ? job.prodi[0] : job.prodi;
                
                return `
                    <div class="bg-white border border-gray-200 rounded-xl p-6 hover:border-blue-600 hover:shadow-lg transition" style="animation: fadeInUp 0.6s ease-out ${index * 0.1}s both">
                        
                        <div class="flex items-start justify-between mb-4">
                            <img src="${job.logo}" alt="${job.company}" class="w-12 h-12 object-contain">
                            <button class="unsave-btn p-2 hover:bg-gray-100 rounded-lg transition text-blue-600" data-job-id="${job.id}">
                                <svg class="w-5 h-5" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <h3 class="text-xl font-bold text-gray-900 mb-2">${job.role}</h3>
                        <p class="text-gray-600 text-sm mb-4">${job.company}</p>
                        
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs font-semibold">
                                ${job.type}
                            </span>
                            <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg text-xs font-medium">
                                📍 ${job.location}
                            </span>
                        </div>
                        
                        <div class="mb-4">
                            <span class="text-xs text-gray-600">${prodiText}</span>
                        </div>
                        
                        <a href="jobs.html#job-${job.id}" class="block w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition text-center">
                            Lihat Detail
                        </a>
                    </div>
                `;
            }).join('');

            // Attach unsave handlers
            document.querySelectorAll('.unsave-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const jobId = parseInt(btn.dataset.jobId);
                    unsaveJob(jobId);
                });
            });
        }

        function unsaveJob(jobId) {
            const index = savedJobs.indexOf(jobId);
            if (index > -1) {
                savedJobs.splice(index, 1);
                localStorage.setItem('savedJobs', JSON.stringify(savedJobs));
                
                Toastify({
                    text: 'Lowongan dihapus dari simpanan',
                    duration: 3000,
                    gravity: 'top',
                    position: 'right',
                    style: {
                        background: '#ef4444',
                        borderRadius: '0.75rem',
                        padding: '1rem 1.5rem',
                        fontWeight: '600'
                    }
                }).showToast();
                
                // Reload page
                setTimeout(() => location.reload(), 500);
            }
        }
    </script>
    
    <!-- Initialize Auth after components load -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
