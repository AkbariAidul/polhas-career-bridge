<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Auth System Test</h1>
        
        <div class="bg-white p-6 rounded-lg shadow mb-4">
            <h2 class="text-xl font-bold mb-4">1. Component Loading Test</h2>
            <div id="navbar-container" class="border p-4 mb-2">
                <p class="text-gray-500">Navbar will load here...</p>
            </div>
            <div id="auth-modal-container" class="border p-4">
                <p class="text-gray-500">Auth modal will load here...</p>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow mb-4">
            <h2 class="text-xl font-bold mb-4">2. Button Test</h2>
            <button id="test-login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg">
                Test Login Button
            </button>
            <p id="test-result" class="mt-4 text-sm"></p>
        </div>
        
        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">3. Console Log</h2>
            <div id="console-log" class="bg-gray-100 p-4 rounded font-mono text-sm max-h-64 overflow-auto"></div>
        </div>
    </div>

    <script type="module">
        const log = (msg) => {
            console.log(msg);
            const logDiv = document.getElementById('console-log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
        };

        log('Starting test...');

        // Test 1: Load components
        try {
            log('Loading components...');
            const { loadCommonComponents } = await import('./js/components.js');
            await loadCommonComponents();
            log('✓ Components loaded successfully');
        } catch (error) {
            log('✗ Error loading components: ' + error.message);
        }

        // Test 2: Check if auth modal exists
        setTimeout(() => {
            const authModal = document.getElementById('auth-modal');
            if (authModal) {
                log('✓ Auth modal found in DOM');
            } else {
                log('✗ Auth modal NOT found in DOM');
            }

            const loginBtn = document.getElementById('login-btn');
            if (loginBtn) {
                log('✓ Login button found in navbar');
            } else {
                log('✗ Login button NOT found in navbar');
            }
        }, 1000);

        // Test 3: Test button click
        document.getElementById('test-login-btn').addEventListener('click', () => {
            log('Test button clicked');
            const authModal = document.getElementById('auth-modal');
            if (authModal) {
                log('Attempting to show auth modal...');
                authModal.classList.remove('hidden');
                authModal.classList.add('flex');
                log('✓ Auth modal should be visible now');
            } else {
                log('✗ Cannot show modal - element not found');
            }
        });

        // Test 4: Load main.js
        try {
            log('Loading main.js...');
            await import('./js/main.js');
            log('✓ main.js loaded successfully');
        } catch (error) {
            log('✗ Error loading main.js: ' + error.message);
        }
    </script>
</body>
</html>
